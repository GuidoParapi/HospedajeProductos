<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minibar | Wampu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f1ea;
            color: #222;
        }

        .contenedor {
            width: 100%;
            max-width: 520px;
            margin: auto;
            padding: 25px 18px 40px;
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 5px;
        }

        .subtitulo {
            margin-top: 8px;
            font-size: 15px;
            color: #666;
        }

        .seccion {
            margin-top: 25px;
            margin-bottom: 12px;
        }

        .seccion h2 {
            font-size: 18px;
            margin: 0;
            padding-bottom: 8px;
            border-bottom: 2px solid #222;
        }

        .producto {
            background: white;
            border-radius: 14px;
            padding: 16px 18px;
            margin-top: 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .nombre {
            font-size: 16px;
            font-weight: 600;
        }

        .descripcion {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .precio {
            font-size: 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .cantidad {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .cantidad button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: #222;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .cantidad span {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
        }

        .whatsapp {
            display: block;
            margin-top: 30px;
            padding: 15px;
            background: #25D366;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .total {
            text-align: right;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .nota {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
            line-height: 1.5;
        }

        .pie {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <header class="encabezado">
        <div class="logo">WAMPU</div>

        <div class="subtitulo">
            Minibar del alojamiento
        </div>
    </header>

    <div id="minibar"></div>

    <div class="total">
        Total: $<span id="total">0,00</span>
    </div>

    <a class="whatsapp" onclick="enviarPedido()">
        📲 Pedir por WhatsApp
    </a>

    <div class="nota">
        Selecciona los productos y las cantidades que deseas.<br>
        Gracias por tu compra 😊
    </div>

    <div class="pie">
        Wampu · Productos para huéspedes
    </div>

</div>


<script>

    /*
    =====================================================
    INVENTARIO
    =====================================================

    AQUÍ SOLO TIENES QUE CAMBIAR EL STOCK.

    Si stock = 0 → el producto NO SE MOSTRARÁ.

    Si stock > 0 → el producto aparecerá disponible.
    */

    const productos = [

        // CERVEZAS
        {
            categoria: "🍺 Cervezas",
            nombre: "Corona",
            descripcion: "Unidad",
            precio: 2.00,
            stock: 10
        },

        {
            categoria: "🍺 Cervezas",
            nombre: "Corona Six Pack",
            descripcion: "6 unidades",
            precio: 10.00,
            stock: 2
        },


        // BEBIDAS
        {
            categoria: "🥤 Bebidas",
            nombre: "Coca Cola",
            descripcion: "Bebida gaseosa",
            precio: 0.50,
            stock: 5
        },

        {
            categoria: "🥤 Bebidas",
            nombre: "Agua",
            descripcion: "Botella",
            precio: 0.60,
            stock: 10
        },

        {
            categoria: "🥤 Bebidas",
            nombre: "Fuze Tea",
            descripcion: "Té listo para beber",
            precio: 0.75,
            stock: 0
        }

    ];


    // Guarda las cantidades seleccionadas
    const cantidades = {};


    // Mostrar productos disponibles
    function mostrarProductos() {

        const minibar = document.getElementById("minibar");

        minibar.innerHTML = "";

        let categoriaActual = "";

        productos.forEach((producto, indice) => {

            // Si no hay stock, no se muestra
            if (producto.stock <= 0) {
                return;
            }

            // Crear nueva sección
            if (producto.categoria !== categoriaActual) {

                categoriaActual = producto.categoria;

                minibar.innerHTML += `
                    <section class="seccion">
                        <h2>${producto.categoria}</h2>
                        <div id="categoria-${producto.categoria}"></div>
                    </section>
                `;
            }

            const seccion = document.querySelector(
                `#categoria-${producto.categoria}`
            );

            if (!cantidades[indice]) {
                cantidades[indice] = 0;
            }

            seccion.innerHTML += `

                <div class="producto">

                    <div>

                        <div class="nombre">
                            ${producto.nombre}
                        </div>

                        <div class="descripcion">
                            ${producto.descripcion}
                        </div>

                        <div class="cantidad">

                            <button onclick="cambiarCantidad(${indice}, -1)">
                                −
                            </button>

                            <span id="cantidad-${indice}">
                                0
                            </span>

                            <button onclick="cambiarCantidad(${indice}, 1)">
                                +
                            </button>

                        </div>

                    </div>

                    <div class="precio">
                        $${producto.precio.toFixed(2).replace(".", ",")}
                    </div>

                </div>
            `;
        });
    }


    // Cambiar cantidad
    function cambiarCantidad(indice, cambio) {

        const producto = productos[indice];

        let nuevaCantidad = cantidades[indice] + cambio;

        // No permitir menos de 0
        if (nuevaCantidad < 0) {
            nuevaCantidad = 0;
        }

        // No permitir pedir más del stock disponible
        if (nuevaCantidad > producto.stock) {
            nuevaCantidad = producto.stock;
        }

        cantidades[indice] = nuevaCantidad;

        document.getElementById(
            `cantidad-${indice}`
        ).textContent = nuevaCantidad;

        calcularTotal();
    }


    // Calcular total
    function calcularTotal() {

        let total = 0;

        productos.forEach((producto, indice) => {

            const cantidad = cantidades[indice] || 0;

            total += producto.precio * cantidad;

        });

        document.getElementById("total").textContent =
            total.toFixed(2).replace(".", ",");
    }


    // Enviar pedido por WhatsApp
    function enviarPedido() {

        let mensaje = "Hola, quisiera realizar el siguiente pedido del minibar:%0A%0A";

        let hayPedido = false;

        let total = 0;

        productos.forEach((producto, indice) => {

            const cantidad = cantidades[indice] || 0;

            if (cantidad > 0) {

                hayPedido = true;

                const subtotal = producto.precio * cantidad;

                total += subtotal;

                mensaje +=
                    "• " +
                    producto.nombre +
                    " x" +
                    cantidad +
                    " — $" +
                    subtotal.toFixed(2).replace(".", ",") +
                    "%0A";
            }
        });


        if (!hayPedido) {

            alert("Selecciona al menos un producto.");

            return;
        }


        mensaje +=
            "%0ATotal: $" +
            total.toFixed(2).replace(".", ",");


        const telefono = "593962684773";

        const url =
            "https://wa.me/" +
            telefono +
            "?text=" +
            mensaje;


        window.open(url, "_blank");
    }


    // Cargar minibar
    mostrarProductos();

</script>

</body>
</html>
